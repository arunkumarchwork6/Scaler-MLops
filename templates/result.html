<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .result-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .result-label {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .result-value {
            font-size: 48px;
            font-weight: bold;
        }
        
        .features-section {
            margin-top: 30px;
        }
        
        .features-section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .feature-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #666;
        }
        
        .feature-name {
            font-weight: 500;
            text-transform: capitalize;
        }
        
        .feature-value {
            color: #667eea;
            font-weight: 600;
        }
        
        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Prediction Result</h1>
        
        <div class="result-box">
            <div class="result-label">Predicted Value</div>
            <div class="result-value">{{ prediction }}</div>
        </div>
        
        <div class="features-section">
            <h2>Input Features</h2>
            {% for feature_name, feature_value in features.items() %}
            <div class="feature-item">
                <span class="feature-name">{{ feature_name }}</span>
                <span class="feature-value">{{ "%.4f"|format(feature_value) }}</span>
            </div>
            {% endfor %}
        </div>
        
        <div class="button-group">
            <button class="btn-back" onclick="window.location.href='/'">Make Another Prediction</button>
        </div>
    </div>
</body>
</html>
