<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regression Model Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
            text-transform: capitalize;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-reset:hover {
            background: #e0e0e0;
        }
        
        .result-container {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            display: none;
        }
        
        .result-container.show {
            display: block;
        }
        
        .result-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .result-value {
            color: #667eea;
            font-size: 32px;
            font-weight: bold;
        }
        
        .error {
            color: #d32f2f;
            padding: 12px;
            background: #ffebee;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid #d32f2f;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Regression Model Predictor</h1>
        <p class="subtitle">Enter feature values to get predictions</p>
        
        <form id="predictionForm">
            {% for feature in features %}
            <div class="form-group">
                <label for="{{ feature }}">{{ feature }}</label>
                <input type="number" id="{{ feature }}" name="{{ feature }}" placeholder="Enter {{ feature }}" step="any" required>
            </div>
            {% endfor %}
            
            <div class="button-group">
                <button type="button" class="btn-predict" onclick="makePrediction()">Predict</button>
                <button type="reset" class="btn-reset">Clear</button>
            </div>
        </form>
        
        <div class="result-container" id="resultContainer">
            <div class="result-label">Predicted Value:</div>
            <div class="result-value" id="predictionResult">-</div>
        </div>
        
        <div class="error" id="errorMessage"></div>
    </div>
    
    <script>
        async function makePrediction() {
            const form = document.getElementById('predictionForm');
            const formData = new FormData(form);
            const data = {};
            
            formData.forEach((value, key) => {
                data[key] = parseFloat(value);
            });
            
            const errorDiv = document.getElementById('errorMessage');
            const resultDiv = document.getElementById('resultContainer');
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('predictionResult').textContent = result.prediction.toFixed(2);
                    resultDiv.classList.add('show');
                    errorDiv.classList.remove('show');
                } else {
                    throw new Error(result.error || 'Prediction failed');
                }
            } catch (error) {
                errorDiv.textContent = 'Error: ' + error.message;
                errorDiv.classList.add('show');
                resultDiv.classList.remove('show');
            }
        }
        
        // Allow prediction on Enter key
        document.getElementById('predictionForm').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                makePrediction();
            }
        });
    </script>
</body>
</html>
